<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024, height=600" />
    <title>M400 Kiosk</title>
    <link rel="stylesheet" href="./src/kiosk/kiosk.css" />
  </head>
  <body>
    <div id="app">
      <header class="k-head">
        <div class="k-logo"><span class="bean"></span>SELF CAFE <small>M400</small></div>
        <nav id="cats" class="k-cats"></nav>
        <div id="clock" class="k-clock"></div>
      </header>
      <main class="k-main">
        <section id="grid" class="k-grid"></section>
        <aside class="k-cart">
          <h2>주문 내역</h2>
          <ul id="cartList"></ul>
          <div class="k-total"><span>합계</span><b id="total">0원</b></div>
          <button id="payBtn" class="k-pay" disabled>결제하기</button>
          <button id="clearBtn" class="k-clear">전체 취소</button>
        </aside>
      </main>
    </div>

    <div id="optModal" class="k-modal" hidden>
      <div class="k-sheet">
        <div class="k-opt-cup" id="optCup"></div>
        <h3 id="optName"></h3>
        <p id="optPrice"></p>
        <div class="k-temps" id="optTemps"></div>
        <div class="k-actions"><button id="optCancel">취소</button><button id="optAdd" class="primary">담기</button></div>
      </div>
    </div>

    <div id="overlay" class="k-overlay" hidden>
      <div class="k-ov-box">
        <div id="ovIcon" class="k-ov-icon"></div>
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <ol id="ovSteps" class="k-steps"></ol>
        <p id="ovGuide" class="k-guide"></p>
        <button id="ovCancel" class="k-ov-cancel" hidden>결제 취소</button>
      </div>
    </div>

    <script src="./cafesim-kiosk-sdk.js"></script>
    <script type="module" src="./src/kiosk/kiosk.js"></script>
  </body>
</html>
