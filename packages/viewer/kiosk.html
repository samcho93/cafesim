<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024, height=600" />
    <title>M400 Kiosk</title>
    <link rel="stylesheet" href="./src/kiosk/kiosk.css" />
  </head>
  <body data-theme="light">
    <div id="app">
      <header class="k-head">
        <nav id="cats" class="k-cats"></nav>
        <div id="brand" class="k-brand" title="관리자 모드: 6번 연속 터치"></div>
      </header>
      <main class="k-main">
        <section class="k-goods">
          <div id="grid" class="k-grid"></div>
          <div id="dots" class="k-dots"></div>
        </section>
        <aside class="k-cart">
          <div class="k-cart-head"><h2>주문 내역</h2><span id="cartCount">0개</span></div>
          <ul id="cartList"></ul>
          <div class="k-total"><span>합계</span><b id="total">0원</b></div>
          <div class="k-cart-btns"><button id="clearBtn" class="k-clear">전체삭제</button><button id="payBtn" class="k-pay">결제하기</button></div>
        </aside>
      </main>
      <footer class="k-foot">
        <span id="footCups"></span><span id="footTemps"></span><span id="footVer"></span><span id="footTest" class="k-test" hidden>테스트 모드</span>
        <span class="k-foot-r"><button id="voiceBtn" title="음성 안내">🔊</button><span id="clock"></span></span>
      </footer>
    </div>

    <!-- standby screen (st_standby_screen) -->
    <div id="standby" class="k-standby" hidden></div>

    <!-- generic modal -->
    <div id="modal" class="k-modal" hidden><div class="k-sheet" id="modalBody"></div></div>

    <!-- full-screen flows: payment, progress, admin -->
    <div id="screen" class="k-screen" hidden></div>

    <div id="banner" class="k-banner" hidden></div>

    <script src="./cafesim-kiosk-sdk.js"></script>
    <script type="module" src="./src/kiosk/kiosk.js"></script>
  </body>
</html>
